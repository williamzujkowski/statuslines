name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Attach a single-file, dependency-free statusline.sh to the release so the
  # documented curl install line always points at an immutable artifact rather
  # than at a moving branch.
  bundle:
    name: Attach standalone bundle
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Build the bundle
        run: bash scripts/bundle.sh dist/statusline.sh

      - name: Verify the bundle runs standalone
        run: |
          set -euo pipefail
          out=$(jq -n '{workspace:{current_dir:"/tmp"},model:{display_name:"Test"}}' | bash dist/statusline.sh)
          printf 'rendered: %s\n' "$out"
          [ -n "$out" ]

      - name: Publish checksums and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum statusline.sh > statusline.sh.sha256)
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            dist/statusline.sh dist/statusline.sh.sha256 --clobber
