# Conventional Commits enforcement.
# Run in CI via wagoid/commitlint-github-action; enforced locally by the
# pure-bash commit-msg hook installed by `make setup` (scripts/commit-msg).
extends:
  - '@commitlint/config-conventional'
rules:
  type-enum:
    - 2
    - always
    - - feat
      - fix
      - perf
      - refactor
      - docs
      - test
      - build
      - ci
      - chore
      - style
      - revert
  scope-enum:
    - 1
    - always
    - - core
      - render
      - segments
      - themes
      - config
      - install
      - test
      - docs
      - ci
      - bench
      - deps
  subject-case:
    - 2
    - never
    - - sentence-case
      - start-case
      - pascal-case
      - upper-case
  subject-full-stop:
    - 2
    - never
    - '.'
  header-max-length:
    - 2
    - always
    - 100
  body-max-line-length:
    - 1
    - always
    - 100
