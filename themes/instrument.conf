# instrument — quiet until something needs you.
#
# The other themes answer "what is the complete state of this session?".
# This one answers the question people actually have mid-task: "am I still
# fine?" Those are different questions and they want different lines.
#
# Three rules, and every choice below follows from one of them.
#
# 1. POSITION ENCODES CATEGORY; COLOUR ENCODES STATE.
#    You already know the second field is the branch, because it is always the
#    second field. Colouring it green as well spends a scarce channel restating
#    what the layout said for free — and with five hues already on the line, the
#    one value that has actually left its band is no longer unique, so it stops
#    standing out. Hence `quiet = 1`: nothing is coloured while it is healthy.
#
# 2. NORMAL IS SILENT.
#    The quota fields render nothing at all below `ratelimit_show_above`. A
#    field that reads "0%" all day teaches the eye to skip that part of the
#    line, and it will still be skipped on the day it reads 94%. Aircraft
#    annunciators, dashboard telltales and process-control HMIs all land on the
#    same rule: the indicator is absent when normal, so its appearance is
#    itself the signal.
#
# 3. COLOUR IS THE LAST CHANNEL, NEVER THE FIRST.
#    A value that needs attention changes shape (`!`), weight (bold) and
#    position (the quota cluster appears) before it changes hue. In a 16-colour
#    terminal the palette belongs to the user's theme — red may sit next to
#    yellow in it — and red/green deficiency affects about 8% of men. The line
#    has to work with the colour stripped, and it does: 50% renders `ctx 50%`,
#    78% renders `ctx 78%!`, 91% renders `ctx 91%!!`.
#
# Green is deliberately unused. Under rule 2 "healthy" has no colour to spend,
# and keeping green out of rotation means red is never adjacent to green.

name        = instrument
description = Quiet until something needs you; identity left, state right
requires    = none

# `spacer` pushes everything after it to the right edge, so the volatile state
# lands in a fixed place you can glance at without reading the line.
line1 = dir git model spacer context ratelimit cost

# Grouping is done with space, not with a glyph. A delimiter repeated at every
# boundary carries no information and asserts that all boundaries are equally
# strong, which is exactly what stops the eye finding the groups.
separator       = "  "
separator_color = dim

# Colour only above the warn threshold...
quiet = 1

# ...and no category colours at all, for the reason in rule 1 above. These are
# set explicitly rather than left to the defaults so that the intent survives
# someone changing a default later.
dir_color        = none
git_color        = none
model_color      = none
model_fast_color = none
cost_color       = none
duration_color   = none
delta_add_color  = none
delta_del_color  = none
tokens_color     = none
effort_low_color    = none
effort_medium_color = none
effort_high_color   = none
effort_max_color    = none

# A wider terminal is not a more readable one: past roughly 120 columns extra
# width buys eye movement and nothing else. On an ultrawide the line stays this
# wide and leaves the rest of the row empty, rather than stretching a gap
# across 200 columns.
max_width     = 120
width_reserve = 6

dir_style = basename

context_label     = ctx
context_warn      = 75
context_crit      = 90
context_bar       = 1
context_bar_width = 10
context_bar_full  = "━"
context_bar_empty = "╌"
# The window size is a constant; it does not need to pay rent every render.
context_200k_mark = 0

# Silent below 70%. Above it, the field appearing is the alert.
ratelimit_show_above  = 70
ratelimit_warn        = 75
ratelimit_crit        = 90
ratelimit_show_7d     = 1
ratelimit_show_reset  = 1
ratelimit_pace        = 1

# Fixed width so the value moving does not shift its neighbours.
cost_width = 5

model_show_modes = 1
model_short      = 1

# Identity is the last thing to go: it is what tells you which window this is.
drop_order = ratelimit cost context model git dir
