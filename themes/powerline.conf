# powerline — Nerd Font separators.
#
# REQUIRES a patched Nerd Font. Without one the separator renders as a tofu
# box. Declared here and in docs/THEMES.md so that is a choice, not a surprise.
name        = powerline
description = Powerline separators, requires a Nerd Font
requires    = nerdfont

line1 = dir git model context cost duration

# U+E0B1 (thin right-pointing separator).
separator       = "  "
separator_color = dim

git_worktree_marker = ⧉

dir_style = short
dir_depth = 2

context_bar       = 1
# Both bar glyphs share an East-Asian width class on purpose. Pairing an
# Ambiguous glyph with a Neutral one makes the bar change physical length as the
# value moves, on any terminal configured to treat ambiguous characters as wide.
context_bar_full  = "█"
context_bar_empty = "▒"

width_reserve = 6
drop_order = duration cost context model git dir
