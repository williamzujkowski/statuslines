# plain — no color, no glyphs, nothing but text.
#
# Serves three purposes: terminals and pipes that cannot render color, users
# who set NO_COLOR, and the test suite, where it is the theme that proves every
# value survives with color stripped (docs/CODING-STANDARDS.md §8).
#
# `color = off` is a global switch rather than a per-key one. Segments choose
# some of their own colors — the context and quota ramps, the dim labels — so
# setting every *_color key to `none` would still leave those behind. If this
# theme renders a single escape sequence, the accessibility claim in the docs
# is false, which is why the test suite asserts on exactly that.
name        = plain
description = Text only, no color and no glyphs
requires    = none
color       = off

line1 = dir git model context cost duration delta

separator       = " | "

dir_style        = basename
model_show_modes = 1
width_reserve    = 6
drop_order       = delta duration cost context model git dir
