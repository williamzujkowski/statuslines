# dashboard — two lines, everything the payload offers.
#
# The successor to the two-line nexus-statusline-v3 layout: line one is the
# session, line two is spend and quota.
name        = dashboard
description = Two-line cockpit with quota, burn rate and cache health
requires    = none

line1 = dir git model agent effort context pr
line2 = cost burn duration delta cache api tokens ratelimit

separator       = " | "
separator_color = dim

dir_style = short
dir_depth = 2

context_warn  = 75
context_crit  = 90
context_label      = ctx
context_bar        = 1
context_bar_width  = 10
context_bar_full   = #
context_bar_empty  = .

ratelimit_show_7d    = 1
ratelimit_show_reset = 1
ratelimit_pace       = 1

width_reserve = 6
drop_order = tokens api cache delta duration burn effort agent pr model git dir
