# default — balanced, one line, no font requirements.
#
# Renders correctly in any font and any terminal. This is the theme the
# accessibility rules in docs/CODING-STANDARDS.md §8 are written against:
# no Nerd Font glyphs, no emoji, every value printed as text.
name        = default
description = Balanced single line, works in any terminal
requires    = none

line1 = dir git model context cost duration delta

separator       = " | "
separator_color = dim

dir_style = basename
dir_color = blue
git_color = green
model_color = magenta

context_label = ctx
context_warn  = 60
context_crit  = 85

cost_color     = yellow
duration_color = cyan

# Claude Code prints its own auto-compact notice beside the status line, so
# a few columns are left unclaimed.
width_reserve = 6

# Dropped right to left as the terminal narrows; the directory and branch are
# the last things to go.
drop_order = delta duration cost context model git dir
